name: Deploy folder to GitHub Pages

on:
  push:
    branches: ["main"] # 사용 중인 기본 브랜치 이름

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './Metro-Cafe-Tycoon-v9.7-Final/metro-cafe-tycoon-v7' # 예: './my-project'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
